# =============================================================================
# Aldi Cart PWA — Dokploy deployment unit (Hono + Vite split)
# =============================================================================
#
# Three services:
#   api       — Hono on Bun (all /api/* routes)
#   web       — nginx serving the Vite-built React PWA
#   scheduler — periodic sync pipeline (Aldi → OFF → match)
#
# Traefik routing (configured in Dokploy):
#   cart.dvcklab.com/api/*  → api:3001
#   cart.dvcklab.com/*      → web:80
#
# Required runtime env vars (set in Dokploy service config):
#   POCKETBASE_ADMIN_EMAIL    — Admin (_superusers) email for PocketBase
#   POCKETBASE_ADMIN_PASSWORD — Matching password
#   POCKETBASE_URL            — Optional. Defaults to https://pb.dvcklab.com
#   ALDI_SERVICE_POINT        — Optional. Defaults to G452
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: aldi-cart-api:latest
    container_name: aldi-cart-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - API_PORT=3001
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:?POCKETBASE_ADMIN_EMAIL is required}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:?POCKETBASE_ADMIN_PASSWORD is required}
      - POCKETBASE_URL=${POCKETBASE_URL:-https://pb.dvcklab.com}
      - ALDI_SERVICE_POINT=${ALDI_SERVICE_POINT:-G452}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    image: aldi-cart-web:latest
    container_name: aldi-cart-web
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ---------------------------------------------------------------------------
  # Scheduler — periodic sync pipeline (Aldi → OFF → match)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    image: aldi-cart-scheduler:latest
    container_name: aldi-cart-scheduler
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
      - SCHEDULE_PORT=3001
      - SCHEDULE_INTERVAL_HOURS=${SCHEDULE_INTERVAL_HOURS:-48}
      - RUN_ON_START=${RUN_ON_START:-false}
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:?POCKETBASE_ADMIN_EMAIL is required}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:?POCKETBASE_ADMIN_PASSWORD is required}
      - POCKETBASE_URL=${POCKETBASE_URL:-https://pb.dvcklab.com}
      - PROXY_URL=${PROXY_URL:-}
      - ALDI_SERVICE_POINT=${ALDI_SERVICE_POINT:-G452}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
